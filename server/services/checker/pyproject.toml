[project]
name = "plagiarism-checker"
version = "0.1.0"
description = "DOCX 标书两两相似性分析 API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pypdf>=6.19.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
]
packaging = [
    "pyinstaller>=6.16,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["checker"]
